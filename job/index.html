<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Portal | Game API</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><style>body{background:#060912}.wrap{max-width:720px;margin:110px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.field{display:flex;flex-direction:column;gap:8px;margin:18px 0}.field input{background:#070b13;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:15px;font-size:18px;text-transform:uppercase}.btn{border:0;border-radius:12px;padding:15px 24px;background:#4f8cff;color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:20px;padding:18px;border-radius:12px;background:#101b2d}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">DM</span><span>Game <b>API</b></span></a><nav><a href="../jobs.html">Jobs</a><a href="../index.html">Home</a></nav></div></header><main class="wrap"><div class="panel"><span class="eyebrow">CAREER PORTAL</span><h1>Check your application</h1><p>Enter the unique application code you received after submitting your application.</p><form id="f"><div class="field"><label>Application code</label><input id="code" required placeholder="GA-XXXXXXXXXX"></div><button class="btn">Check Status</button></form><div id="msg" class="msg" hidden></div></div></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';const codeEl=document.getElementById('code');const p=new URLSearchParams(location.search);if(p.get('code'))codeEl.value=p.get('code');document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('msg');m.hidden=false;m.textContent='Checking...';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_code:codeEl.value})});const d=await r.json();if(!r.ok)throw new Error(d.error);sessionStorage.setItem('jobApplication',JSON.stringify(d.application));location.href='review.html?code='+encodeURIComponent(d.application.application_code)}catch(x){m.textContent=x.message}});</script><script src="../js/main.js?v=20260902-5"></script></body></html>
