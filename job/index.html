<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Portal | Game API</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><style>body{background:#060912}.wrap{max-width:720px;margin:110px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.field{display:flex;flex-direction:column;gap:8px;margin:18px 0}.field input{background:#070b13;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:15px;font-size:18px;text-transform:uppercase}.btn{border:0;border-radius:12px;padding:15px 24px;background:#4f8cff;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:20px;padding:18px;border-radius:12px;background:#101b2d}.success{border:1px solid #35d07f44}.error{border:1px solid #ff5c5c44}</style></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="../index.html"><span class="brand-mark">DM</span><span>Game <b>API</b></span></a><nav><a href="../jobs.html">Jobs</a><a href="../index.html">Home</a></nav></div></header><main class="wrap"><div class="panel"><span class="eyebrow">CAREER PORTAL</span><h1>Check your application</h1><p>Enter the unique application code you received after submitting your application.</p><form id="f" novalidate><div class="field"><label for="code">Application code</label><input id="code" name="application_code" required placeholder="GA-XXXXXXXXXX" autocomplete="off" maxlength="32" spellcheck="false"></div><button id="btn" class="btn" type="submit">Check Status</button></form><div id="msg" class="msg" hidden role="status" aria-live="polite"></div></div></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';const form=document.getElementById('f'),codeEl=document.getElementById('code'),msg=document.getElementById('msg'),btn=document.getElementById('btn');const params=new URLSearchParams(location.search);if(params.get('code'))codeEl.value=params.get('code').trim().toUpperCase();function show(text,type=''){msg.hidden=false;msg.className='msg '+type;msg.textContent=text}form.addEventListener('submit',async e=>{e.preventDefault();const code=codeEl.value.trim().toUpperCase();if(!code){show('Please enter your application code.','error');return}btn.disabled=true;btn.textContent='Checking...';msg.hidden=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({application_code:code})});let d={};try{d=await r.json()}catch{}if(!r.ok){throw new Error(d.error||`Unable to check application status (HTTP ${r.status}).`)}if(!d.application||!d.application.application_code){throw new Error('The status service returned an invalid response. Please try again.')}sessionStorage.setItem('jobApplication',JSON.stringify(d.application));location.href='review.html?code='+encodeURIComponent(d.application.application_code)}catch(err){show(err.message||'Unable to check application status. Please try again.','error')}finally{btn.disabled=false;btn.textContent='Check Status'}});</script><script src="../js/main.js?v=20260903-6"></script></body></html>
