<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Application Review | Game API</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<style>
body{background:#060912}.wrap{max-width:900px;margin:70px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.status{padding:22px;border-radius:16px;margin:22px 0;background:#101b2d}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.detail{background:#0a101c;border:1px solid #ffffff10;border-radius:12px;padding:15px}.label{font-size:12px;color:#8e9bb0;text-transform:uppercase}.value{margin-top:6px;font-weight:700;word-break:break-word}.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;background:#4f8cff;color:#fff;font-weight:800;text-decoration:none;margin:6px}.muted{color:#aab6c8}.success{border:1px solid #1f9d68;background:#0b241b}.declined{border:1px solid #b94b5f;background:#291119}.pending{border:1px solid #8b6f32}.error{margin:10px 0;padding:12px;border-radius:10px;background:#2a1118}.refresh{background:#182438}
</style>
</head>
<body>
<main class="wrap"><div class="panel">
<span class="eyebrow">APPLICATION REVIEW</span>
<div id="content">Loading your application...</div>
</div></main>
<script>
const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';
const params=new URLSearchParams(location.search);
const code=(params.get('code')||JSON.parse(sessionStorage.getItem('jobApplication')||'null')?.application_code||'').trim().toUpperCase();
const content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString():'—';
async function load(){
 if(!code){content.innerHTML='<h1>Application code required</h1><p class="muted">Return to the application portal and enter your application code.</p><a class="btn" href="index.html">Back to Portal</a>';return}
 content.innerHTML='<h1>Loading...</h1><p class="muted">Checking the latest application status.</p>';
 try{
  const r=await fetch(API,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','Cache-Control':'no-cache'},body:JSON.stringify({application_code:code})});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Unable to check application.');
  const a=d.application;
  sessionStorage.setItem('jobApplication',JSON.stringify(a));
  const review=String(a.review_status||'pending').toLowerCase();
  const job=String(a.job_status||'applied').toLowerCase();
  let html='<h1>Application Details</h1><p class="muted">Application code: <b>'+esc(a.application_code)+'</b></p>';
  html+='<div class="details">';
  html+='<div class="detail"><div class="label">Full Name</div><div class="value">'+esc(a.full_name)+'</div></div>';
  html+='<div class="detail"><div class="label">Email</div><div class="value">'+esc(a.email)+'</div></div>';
  html+='<div class="detail"><div class="label">Job</div><div class="value">'+esc(a.job_title)+'</div></div>';
  html+='<div class="detail"><div class="label">Review Status</div><div class="value">'+esc(review.toUpperCase())+'</div></div>';
  html+='<div class="detail"><div class="label">Job Status</div><div class="value">'+esc(job.toUpperCase())+'</div></div>';
  html+='<div class="detail"><div class="label">Submitted</div><div class="value">'+esc(fmt(a.created_at))+'</div></div>';
  html+='</div>';
  if(review==='approved'){
   html+='<div class="status success"><h2>✓ Application Approved</h2><p>Your application has been approved. You can continue to the job account step.</p><a class="btn" href="create-account.html?code='+encodeURIComponent(a.application_code)+'">Create Job Account</a></div>';
  }else if(review==='declined'){
   html+='<div class="status declined"><h2>Application Declined</h2><p>The review team found the following issue(s):</p>'+(a.review_errors||[]).map(x=>'<div class="error">'+esc(x)+'</div>').join('')+'<a class="btn" href="../apply.html?role='+encodeURIComponent(a.job_title)+'">Re-apply</a></div>';
  }else{
   html+='<div class="status pending"><h2>⏳ Review Pending</h2><p>Your application has been received and is currently waiting for review. This page checks the live status from the server.</p></div>';
  }
  html+='<p><button class="btn refresh" onclick="load()">↻ Refresh Status</button> <a class="btn" href="index.html">Application Portal</a></p>';
  content.innerHTML=html;
 }catch(e){content.innerHTML='<h1>Unable to load application</h1><p>'+esc(e.message)+'</p><button class="btn refresh" onclick="load()">Try Again</button><a class="btn" href="index.html">Back to Portal</a>'}
}
load();
setInterval(load,30000);
</script>
</body>
</html>
