<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Review | Game API</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><style>body{background:#060912}.wrap{max-width:820px;margin:100px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.status{padding:20px;border-radius:16px;margin:22px 0;background:#101b2d}.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;background:#4f8cff;color:#fff;font-weight:800;text-decoration:none;margin:6px}.error{margin:10px 0;padding:12px;border-radius:10px;background:#2a1118}.muted{color:#aab6c8}</style></head><body><main class="wrap"><div class="panel"><span class="eyebrow">APPLICATION REVIEW</span><div id="content">Loading your application...</div></div></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';const code=new URLSearchParams(location.search).get('code')||JSON.parse(sessionStorage.getItem('jobApplication')||'null')?.application_code;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!code){content.innerHTML='<h1>Application code required</h1><p>Return to the portal and enter your code.</p><a class="btn" href="index.html">Back to Portal</a>';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({application_code:code})});const d=await r.json();if(!r.ok)throw new Error(d.error);const a=d.application;let html='<h1>'+esc(a.job_title)+'</h1><p class="muted">Application code: <b>'+esc(a.application_code)+'</b></p>';if(a.document_status==='Approved'){html+='<div class="status"><h2>✓ Documents approved</h2><p>Your application passed document review. You may continue to the job account step.</p><a class="btn" href="create-account.html?code='+encodeURIComponent(a.application_code)+'">Create Job Account</a></div>'}else if(a.document_status==='Declined'){html+='<div class="status"><h2>Document review declined</h2><p>The review team found the following issue(s):</p>'+(a.review_errors||[]).map(x=>'<div class="error">'+esc(x)+'</div>').join('')+'<a class="btn" href="../apply.html?role='+encodeURIComponent(a.job_title)+'">Re-apply</a></div>'}else{html+='<div class="status"><h2>⏳ Review pending</h2><p>Your application has been received and is waiting for document review. Please check again later.</p></div>'}content.innerHTML=html}catch(e){content.innerHTML='<h1>Unable to load application</h1><p>'+esc(e.message)+'</p><a class="btn" href="index.html">Try Again</a>'}}load();</script></body></html>
