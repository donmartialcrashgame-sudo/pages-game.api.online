<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Application Review | Game API</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><style>body{background:#060912}.wrap{max-width:900px;margin:70px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.status{padding:22px;border-radius:16px;margin:22px 0;background:#101b2d}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.detail{background:#0a101c;border:1px solid #ffffff10;border-radius:12px;padding:15px}.label{font-size:12px;color:#8e9bb0;text-transform:uppercase}.value{margin-top:6px;font-weight:700;word-break:break-word}.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;background:#4f8cff;color:#fff;font-weight:800;text-decoration:none;margin:6px;cursor:pointer}.muted{color:#aab6c8}.success{border:1px solid #1f9d68;background:#0b241b}.declined{border:1px solid #b94b5f;background:#291119}.pending{border:1px solid #8b6f32}.error{margin:10px 0;padding:12px;border-radius:10px;background:#2a1118}.refresh{background:#182438}.redirect{font-size:13px;color:#91a0b5}</style></head><body><main class="wrap"><div class="panel"><span class="eyebrow">APPLICATION REVIEW</span><div id="content">Loading your application...</div></div></main><script>const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';const DASH='https://game-api.online/job-dashboard.html';const params=new URLSearchParams(location.search);let code=(params.get('code')||'').trim().toUpperCase();if(!code){try{code=String(JSON.parse(sessionStorage.getItem('jobApplication')||'null')?.application_code||'').trim().toUpperCase()}catch{}}const content=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>d?new Date(d).toLocaleString():'—';let redirecting=false;async function load(){if(!code){content.innerHTML='<h1>Application code required</h1><p class="muted">Return to the application portal and enter your application code.</p><a class="btn" href="index.html">Back to Portal</a>';return}try{const r=await fetch(API+'?application_code='+encodeURIComponent(code),{method:'GET',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Server returned HTTP '+r.status));const a=d.application,acct=d.account||null;if(!a)throw new Error('Application data was not returned.');sessionStorage.setItem('jobApplication',JSON.stringify(a));const review=String(a.review_status||'pending').toLowerCase(),job=String(a.job_status||'applied').toLowerCase(),acctStatus=String(acct?.account_status||a.account_creation_status||'').toLowerCase(),exam=String(acct?.exam_status||'not_started').toLowerCase();let html='<h1>Application Details</h1><p class="muted">Application code: <b>'+esc(a.application_code)+'</b></p><div class="details">';[['Full Name',a.full_name],['Email',a.email],['Phone',a.phone],['Job Applied For',a.job_title],['Application Status',review.toUpperCase()],['Job Status',job.toUpperCase()],['Account Status',acct?acctStatus.toUpperCase():'NOT CREATED'],['Exam Status',acct?exam.toUpperCase():'NOT STARTED'],['Submitted',fmt(a.created_at)],['Last Updated',fmt(a.updated_at)],['Reviewed At',fmt(a.reviewed_at)]].forEach(([l,v])=>html+='<div class="detail"><div class="label">'+l+'</div><div class="value">'+esc(v)+'</div></div>');html+='</div>';if(Array.isArray(a.skills)&&a.skills.length)html+='<div class="detail"><div class="label">Skills</div><div class="value">'+esc(a.skills.join(', '))+'</div></div>';if(review==='declined'){html+='<div class="status declined"><h2>Application Declined</h2><p>The review team found the following issue(s):</p>'+((Array.isArray(a.review_errors)?a.review_errors:[]).map(x=>'<div class="error">'+esc(x)+'</div>').join('')||'<p>No additional reason was provided.</p>')+'<a class="btn" href="../apply.html?role='+encodeURIComponent(a.job_title)+'">Re-apply</a></div>'}else if(review!=='approved'){html+='<div class="status pending"><h2>⏳ Review Pending</h2><p>Your application has been received and is currently waiting for review.</p></div>'}else if(!acct){html+='<div class="status success"><h2>✓ Application Approved</h2><p>Your application has been approved. Continue to the job account step.</p><a class="btn" href="create-account.html?code='+encodeURIComponent(a.application_code)+'">Create Job Account</a></div>'}else if(acctStatus==='pending'){html+='<div class="status pending"><h2>⏳ Account Review Pending</h2><p>Your Game API account has been created successfully and is waiting for account approval.</p><p><b>Permanent User ID:</b> '+esc(acct.user_id||'—')+'</p><p class="redirect">This page checks again automatically every 30 seconds.</p></div>'}else if(acctStatus==='declined'){html+='<div class="status declined"><h2>Account Registration Declined</h2><p>Your Game API account registration was declined. Please contact support for the next step.</p></div>'}else if(acctStatus==='approved'){html+='<div class="status success"><h2>✓ Game API Account Approved</h2><p>Your account has been approved. You can now continue to your employee dashboard.</p><p><b>Permanent User ID:</b> '+esc(acct.user_id||'—')+'</p><a class="btn" href="'+DASH+'">Open Employee Dashboard</a><p class="redirect">Redirecting automatically…</p></div>';if(!redirecting){redirecting=true;setTimeout(()=>location.href=DASH,2500)}}html+='<p><button class="btn refresh" onclick="load()">↻ Refresh Status</button> <a class="btn" href="index.html">Application Portal</a></p>';content.innerHTML=html}catch(e){content.innerHTML='<h1>Unable to load application</h1><p class="error">'+esc(e.message)+'</p><button class="btn refresh" onclick="load()">Try Again</button> <a class="btn" href="index.html">Back to Portal</a>'}}load();setInterval(load,30000);</script></body></html>
