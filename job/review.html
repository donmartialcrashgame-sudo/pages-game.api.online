<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Application Review | Game API</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css">
<style>
body{background:#060912}.wrap{max-width:920px;margin:55px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:34px}.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0}.detail{background:#0a101c;border:1px solid #ffffff10;border-radius:12px;padding:15px}.label{font-size:12px;color:#8e9bb0;text-transform:uppercase}.value{margin-top:6px;font-weight:700;word-break:break-word}.status{padding:22px;border-radius:16px;margin:22px 0;background:#101b2d}.success{border:1px solid #1f9d68;background:#0b241b}.declined{border:1px solid #b94b5f;background:#291119}.pending{border:1px solid #8b6f32;background:#241c0b}.error{margin:10px 0;padding:12px;border-radius:10px;background:#2a1118}.muted{color:#aab6c8;line-height:1.7}.btn{display:inline-block;border:0;border-radius:12px;padding:14px 22px;background:#4f8cff;color:#fff;font-weight:800;text-decoration:none;margin:6px;cursor:pointer}.refresh{background:#182438}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field input{box-sizing:border-box;width:100%;background:#070b13;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:14px}.account-box{margin-top:18px;padding:22px;border-radius:16px;background:#08101d;border:1px solid #4f8cff33}.account-box h3{margin-top:0}.result{display:none;margin-top:18px;padding:18px;border-radius:14px}.result.success{display:block}.result.error{display:block;border-color:#ff6b6b55;background:#2a1118}.code{font:900 25px/1.2 monospace;letter-spacing:2px;word-break:break-all}.copy{font-size:12px;color:#91a0b5}.top-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:650px){.panel{padding:23px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body><main class="wrap"><div class="panel"><span class="eyebrow">APPLICATION REVIEW</span><div id="content">Loading your application...</div></div></main>
<script>
const API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/job-check-status';
const ACCOUNT_API='https://qbagxeqquskkjksoraiz.supabase.co/functions/v1/create-game-api-account';
const DASH='https://pages-game-api-online.onrender.com/job/dashboard.html';
const params=new URLSearchParams(location.search);let code=(params.get('code')||'').trim().toUpperCase();if(!code){try{code=String(JSON.parse(sessionStorage.getItem('jobApplication')||'null')?.application_code||'').trim().toUpperCase()}catch{}}
const content=document.getElementById('content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d?new Date(d).toLocaleString():'—';
function showError(message){content.innerHTML='<h1>Unable to load application</h1><p class="error">'+esc(message)+'</p><button class="btn refresh" onclick="load()">Try Again</button> <a class="btn" href="index.html">Back to Portal</a>'}
function accountForm(a){return '<div class="account-box"><h3>✓ Application Approved — Create Your Game API Account</h3><p class="muted">Create your account here without leaving this page. Your permanent User ID will remain linked to this application.</p><form id="accountForm" novalidate><div class="form-grid"><div class="field"><label>Full name</label><input id="acctName" value="'+esc(a.full_name||'')+'" readonly></div><div class="field"><label>Approved email</label><input id="acctEmail" type="email" value="'+esc(a.email||'')+'" readonly></div><div class="field"><label>Create password</label><input id="acctPassword" type="password" minlength="8" autocomplete="new-password" required><small class="muted">At least 8 characters.</small></div><div class="field"><label>Confirm password</label><input id="acctConfirm" type="password" minlength="8" autocomplete="new-password" required></div><div class="field full"><label><input id="acctTerms" type="checkbox" required> I understand that my account will be reviewed before work access is enabled.</label></div><div class="field full"><button id="acctSubmit" class="btn" type="submit">Create Account &amp; Submit for Review</button></div></div></form><div id="acctResult" class="result"></div></div>'}
async function submitAccount(e,a){e.preventDefault();const form=e.currentTarget,name=document.getElementById('acctName').value,email=document.getElementById('acctEmail').value,password=document.getElementById('acctPassword').value,confirm=document.getElementById('acctConfirm').value,button=document.getElementById('acctSubmit'),res=document.getElementById('acctResult');if(!form.checkValidity()){form.reportValidity();return}if(password!==confirm){res.style.display='block';res.className='result error';res.textContent='Passwords do not match.';return}button.disabled=true;button.textContent='Submitting...';res.style.display='none';try{const r=await fetch(ACCOUNT_API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({application_code:code,full_name:name,email:email,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.details||'Unable to create account.');const acct=d.account||{};res.style.display='block';res.className='result success';res.innerHTML='<h3>✓ Account registration submitted</h3><p>Your Game API account is now <b>Pending Review</b>.</p><p><b>Application code</b></p><div class="code">'+esc(acct.application_code||code)+'</div><p><b>Permanent User ID</b></p><div class="code" style="font-size:15px;letter-spacing:0">'+esc(acct.auth_user_id||acct.user_id||'Created successfully')+'</div><p class="copy">Keep your application code. Use the same code to check both application and account status.</p>';form.style.display='none';setTimeout(load,600)}catch(err){res.style.display='block';res.className='result error';res.textContent=err.message||'Unable to create account.'}finally{button.disabled=false;button.textContent='Create Account & Submit for Review'}}
async function load(){if(!code){content.innerHTML='<h1>Application code required</h1><p class="muted">Enter the application code you received after submitting your application.</p><a class="btn" href="index.html">Back to Portal</a>';return}try{const r=await fetch(API+'?application_code='+encodeURIComponent(code),{method:'GET',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('Server returned HTTP '+r.status));const a=d.application,acct=d.account||null;if(!a)throw new Error('Application data was not returned.');sessionStorage.setItem('jobApplication',JSON.stringify(a));const review=String(a.review_status||'pending').toLowerCase(),job=String(a.job_status||'applied').toLowerCase(),acctStatus=String(acct?.account_status||a.account_creation_status||'').toLowerCase(),exam=String(acct?.exam_status||'not_started').toLowerCase();let html='<h1>Application Details</h1><p class="muted">Application code: <b>'+esc(a.application_code)+'</b></p><div class="details">';[['Full Name',a.full_name],['Email',a.email],['Phone',a.phone],['Job Applied For',a.job_title],['Application Status',review.toUpperCase()],['Job Status',job.toUpperCase()],['Account Status',acct?acctStatus.toUpperCase():'NOT CREATED'],['Exam Status',acct?exam.toUpperCase():'NOT STARTED'],['Submitted',fmt(a.created_at)],['Last Updated',fmt(a.updated_at)],['Reviewed At',fmt(a.reviewed_at)]].forEach(([l,v])=>html+='<div class="detail"><div class="label">'+l+'</div><div class="value">'+esc(v)+'</div></div>');html+='</div>';if(Array.isArray(a.skills)&&a.skills.length)html+='<div class="detail"><div class="label">Skills</div><div class="value">'+esc(a.skills.join(', '))+'</div></div>';if(review==='declined'){html+='<div class="status declined"><h2>Application Declined</h2>'+((Array.isArray(a.review_errors)?a.review_errors:[]).map(x=>'<div class="error">'+esc(x)+'</div>').join('')||'<p>No additional reason was provided.</p>')+'</div>'}else if(review!=='approved'){html+='<div class="status pending"><h2>⏳ Review Pending</h2><p>Your application has been received and is currently waiting for review.</p></div>'}else if(!acct){html+=accountForm(a)}else if(acctStatus==='pending'){html+='<div class="status pending"><h2>⏳ Account Review Pending</h2><p>Your Game API account has been created successfully and is waiting for account approval.</p><p><b>Permanent User ID:</b> '+esc(acct.user_id||'—')+'</p></div>'}else if(acctStatus==='declined'){html+='<div class="status declined"><h2>Account Registration Declined</h2><p>Your Game API account registration was declined. Please contact support for the next step.</p></div>'}else if(acctStatus==='approved'){html+='<div class="status success"><h2>✓ Game API Account Approved</h2><p>Your account has been approved. You can continue to your Game API workspace.</p><p><b>Permanent User ID:</b> '+esc(acct.user_id||'—')+'</p><a class="btn" href="'+DASH+'?code='+encodeURIComponent(code)+'">Open Game API Dashboard</a></div>'}html+='<div class="top-actions"><button class="btn refresh" onclick="load()">↻ Refresh Status</button><a class="btn" href="index.html">Application Portal</a></div>';content.innerHTML=html;const af=document.getElementById('accountForm');if(af)af.addEventListener('submit',e=>submitAccount(e,a));}catch(e){showError(e.message||'Unable to load application.')}}
load();setInterval(load,30000);
</script></body></html>
