<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Game API Job Exam</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../css/style.css"><style>
body{background:#060912;color:#f8fafc}.wrap{max-width:980px;margin:48px auto;padding:20px}.panel{background:#0c1320;border:1px solid #ffffff12;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0008}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;flex-wrap:wrap}.muted{color:#98a7bc;line-height:1.7}.timer{padding:12px 16px;border-radius:12px;background:#17243a;font-weight:900;font-variant-numeric:tabular-nums}.progress{height:8px;background:#182438;border-radius:999px;overflow:hidden;margin:20px 0}.progress>span{display:block;height:100%;width:0;background:#4f8cff;transition:width .25s}.question{padding:22px;border:1px solid #ffffff12;border-radius:18px;background:#08101d;margin-top:18px}.qnum{font-size:11px;color:#7ea9ff;font-weight:900;letter-spacing:.12em}.question h2{font-size:22px;line-height:1.45;margin:10px 0 20px}.options{display:grid;gap:11px}.option{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid #ffffff12;border-radius:13px;background:#0b1422;cursor:pointer}.option:hover{border-color:#4f8cff55}.option input{margin-top:4px;accent-color:#4f8cff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:12px;padding:13px 18px;background:#4f8cff;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#182438}.btn:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:18px;padding:20px;border-radius:16px;border:1px solid #ffffff12;background:#101928}.status.success{background:#0b241b;border-color:#35d07f66}.status.fail{background:#2a1118;border-color:#ff6b6b66}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{padding:16px;border-radius:14px;background:#08101d;border:1px solid #ffffff12}.stat span{display:block;color:#7d8aa0;font-size:10px;text-transform:uppercase}.stat strong{display:block;margin-top:6px;font-size:20px}.hidden{display:none!important}@media(max-width:680px){.wrap{padding:14px}.panel{padding:21px}.grid{grid-template-columns:1fr}.question h2{font-size:19px}}
</style></head><body>
<main class="wrap"><div class="panel"><div class="top"><div><span class="eyebrow">GAME API TEAM ONBOARDING</span><h1>Live Job Exam</h1><p id="intro" class="muted">Your exam is taken completely on this page. Stay here until you submit it.</p></div><div id="timer" class="timer">10:00</div></div><div class="grid"><div class="stat"><span>Job</span><strong id="jobTitle">Loading…</strong></div><div class="stat"><span>Question</span><strong id="questionCount">0 / 0</strong></div><div class="stat"><span>Pass mark</span><strong>70%</strong></div></div><div class="progress"><span id="bar"></span></div><div id="questionArea"></div><div id="status" class="status hidden"></div></div></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.105.0';
const URL='https://qbagxeqquskkjksoraiz.supabase.co',KEY='sb_publishable_chfRxHSFPSA1SZJtBajtKA_I7vs8R--';
const API=URL+'/functions/v1/job-exam';const supabase=createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=(new URLSearchParams(location.search).get('code')||'').trim().toUpperCase();let questions=[],answers={},current=0,seconds=600,running=false,submitted=false,timer=null;
function showStatus(msg,type=''){const el=$('status');el.className='status '+type;el.innerHTML=msg;el.classList.remove('hidden')}
function tick(){if(!running||submitted)return;seconds--;const m=Math.floor(seconds/60),s=seconds%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(seconds<=0){seconds=0;running=false;submitExam(true)}}
function render(){if(submitted)return;const q=questions[current];if(!q)return;const selected=answers[q.id];$('questionCount').textContent=(current+1)+' / '+questions.length;$('bar').style.width=((current+1)/questions.length*100)+'%';$('questionArea').innerHTML='<div class="question"><div class="qnum">QUESTION '+(current+1)+'</div><h2>'+esc(q.question)+'</h2><div class="options">'+(Array.isArray(q.options)?q.options:[]).map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'" '+(selected===i?'checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div><div class="actions">'+(current>0?'<button class="btn secondary" id="prev">Previous</button>':'')+(current<questions.length-1?'<button class="btn" id="next">Next</button>':'<button class="btn" id="submit">Submit Exam</button>')+'</div></div>';
 document.querySelectorAll('input[name="answer"]').forEach(r=>r.addEventListener('change',e=>{answers[q.id]=Number(e.target.value)}));$('prev')?.addEventListener('click',()=>{current--;render()});$('next')?.addEventListener('click',()=>{if(answers[q.id]===undefined){showStatus('Please choose an answer before moving to the next question.','fail');return}current++;showStatus('');render()});$('submit')?.addEventListener('click',()=>submitExam(false));}
async function getSession(){const {data,error}=await supabase.auth.getSession();if(error)throw error;if(!data.session)throw new Error('Your Game API session is missing. Please sign in through your account dashboard first.');return data.session}
async function loadExam(){try{const s=await getSession();const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+s.access_token,apikey:KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({mode:'questions'})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to load the exam.');questions=Array.isArray(d.questions)?d.questions:[];if(!questions.length)throw new Error('No exam questions are available for your role yet.');$('jobTitle').textContent=d.job_title||'Game API Role';seconds=600;running=true;timer=setInterval(tick,1000);render()}catch(e){$('questionArea').innerHTML='';$('timer').textContent='--:--';showStatus('<h2>Exam unavailable</h2><p>'+esc(e.message||'Unable to load the exam.')+'</p><p class="muted">Return to your Game API dashboard and try again.</p>','fail')}}
async function submitExam(auto){if(submitted)return;const q=questions[current];if(!auto&&q&&answers[q.id]===undefined){showStatus('Please choose an answer before submitting the exam.','fail');return}if(!auto){for(const item of questions){if(answers[item.id]===undefined){current=questions.indexOf(item);render();showStatus('Please answer every question before submitting the exam.','fail');return}}}submitted=true;running=false;clearInterval(timer);document.querySelectorAll('button').forEach(b=>b.disabled=true);const session=await getSession();const payload=questions.map(q=>({question_id:q.id,selected_option:Number.isInteger(answers[q.id])?answers[q.id]:null}));try{const r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,apikey:KEY,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({mode:'submit',answers:payload,application_code:code})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to submit the exam.');$('questionArea').innerHTML='';$('bar').style.width='100%';$('questionCount').textContent=questions.length+' / '+questions.length;showStatus('<h2>'+(d.passed?'✓ Exam Passed':'Exam Not Passed')+'</h2><p>You completed the live exam on this page.</p><div class="grid"><div class="stat"><span>Score</span><strong>'+esc(d.score)+'%</strong></div><div class="stat"><span>Result</span><strong>'+esc(d.passed?'PASSED':'FAILED')+'</strong></div><div class="stat"><span>Questions</span><strong>'+esc(d.total_questions||questions.length)+'</strong></div></div><p class="muted">Your result has been recorded against your Game API job account. You may now remain on this page to review the result.</p>',''+(d.passed?'success':'fail'));}catch(e){submitted=false;showStatus('<h2>Submission failed</h2><p>'+esc(e.message||'Unable to submit the exam.')+'</p><button class="btn secondary" id="retrySubmit">Try Again</button>','fail');$('retrySubmit').addEventListener('click',()=>submitExam(false))}}
loadExam();
</script></body></html>
