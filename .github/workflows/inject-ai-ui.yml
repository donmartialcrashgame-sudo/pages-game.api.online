name: Enable Game API site-wide AI chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  inject-ai-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AI chat scripts to every HTML page
        shell: python
        run: |
          from pathlib import Path

          main_tag = '<script src="js/main.js?v=20260902-5"></script>'
          enhancement_tag = '<script src="js/ai-chat-enhancements.js?v=20260902-1"></script>'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'js/main.js' not in text:
                  text = text.replace('</body>', f'{main_tag}</body>')

              if 'js/ai-chat-enhancements.js' not in text:
                  text = text.replace('</body>', f'{enhancement_tag}</body>')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Create pull request with site-wide injection
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Enable AI chat and consent UI site-wide"
          branch: automation/site-wide-ai-chat
          delete-branch: true
          title: "Enable Game API AI chat site-wide"
          body: |
            Adds the Game API AI Assistant, AI teaser, End Chat/rating lifecycle, and privacy/cookie consent UI to every HTML page.
          labels: automation

      # Uses a PR instead of pushing directly to main, so protected branches remain safe.
