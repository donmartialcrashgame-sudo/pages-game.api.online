name: Enable Game API site-wide AI chat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject-ai-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add AI chat scripts to every HTML page
        shell: python
        run: |
          from pathlib import Path

          main_tag = '<script src="js/main.js?v=20260902-5"></script>'
          enhancement_tag = '<script src="js/ai-chat-enhancements.js?v=20260902-1"></script>'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              if 'js/main.js' not in text:
                  text = text.replace('</body>', f'{main_tag}</body>')

              if 'js/ai-chat-enhancements.js' not in text:
                  text = text.replace('</body>', f'{enhancement_tag}</body>')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit site-wide injection
        run: |
          git config user.name "Game API Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "Enable AI chat and consent UI site-wide"
          git push

      # Site-wide AI, teaser, rating and privacy-consent deployment
