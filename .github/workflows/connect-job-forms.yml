name: Connect job application forms
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add application connector
        shell: bash
        run: |
          set -e
          for f in job-api-backend-developer.html job-frontend-developer.html job-digital-marketing.html job-future-roles.html; do
            if [ -f "$f" ] && ! grep -q 'js/job-apply-redirect.js' "$f"; then
              sed -i 's#</body>#<script src="js/job-apply-redirect.js?v=20260903-1"></script></body>#' "$f"
            fi
          done
      - name: Commit changes
        run: |
          git config user.name 'Game API Automation'
          git config user.email 'actions@github.com'
          git add job-*.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect job detail pages to application portal'
          git push